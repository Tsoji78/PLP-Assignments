<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailEase - Live Train Status</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <i class="fas fa-train"></i>
                <h1>RailEase</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Book Tickets</a></li>
                    <li><a href="my-bookings.html">My Bookings</a></li>
                    <li><a href="live-status.html" class="active">Live Status</a></li>
                    <li><a href="pnr-enquiry.html">PNR Enquiry</a></li>
                </ul>
                <div class="user-actions" id="user-actions">
                    <!-- Dynamically filled by JavaScript -->
                </div>
            </nav>
            <button class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="live-status-section">
            <div class="status-form-container">
                <h2>Check Live Train Status</h2>
                <form id="status-form">
                    <div class="form-group">
                        <label for="train-number">Train Number/Name</label>
                        <input type="text" id="train-number" placeholder="Enter train number or name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="journey-date">Journey Date</label>
                        <input type="date" id="journey-date" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Check Status</button>
                </form>
            </div>
            
            <div class="status-results hidden" id="status-results">
                <div class="status-header">
                    <h3 id="status-train-name"></h3>
                    <div class="status-actions">
                        <button id="refresh-status" class="btn btn-outline">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>
                
                <div class="status-summary">
                    <div class="status-item">
                        <span>Current Status</span>
                        <strong id="current-status">On Time</strong>
                    </div>
                    <div class="status-item">
                        <span>Last Location</span>
                        <strong id="last-location">New Delhi (NDLS)</strong>
                    </div>
                    <div class="status-item">
                        <span>Delay</span>
                        <strong id="delay-time">0 min</strong>
                    </div>
                </div>
                
                <div class="status-timeline">
                    <h4>Route & Schedule</h4>
                    <div class="timeline-container" id="timeline-container">
                        <!-- Timeline items will be inserted here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <!-- Same footer as index.html -->
    </footer>

    <script src="auth.js"></script>
    <script src="live-status.js"></script>
</body>
</html>
